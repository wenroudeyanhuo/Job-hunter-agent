services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ADDR: ":8080"
      APP_DB_PATH: /data/job-hunter-agent.db
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      SOURCE_URLS: ${SOURCE_URLS:-}
      ACTIVE_SOURCE_WEB_SEARCH: ${ACTIVE_SOURCE_WEB_SEARCH:-1}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-0}
      AGENT_ORCHESTRATOR: ${AGENT_ORCHESTRATOR:-deterministic}
      SEMANTIC_MEMORY_PROVIDER: ${SEMANTIC_MEMORY_PROVIDER:-local_hash}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-job_hunter_memory}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - job-hunter-data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  qdrant:
    image: qdrant/qdrant:v1.12.6
    profiles:
      - qdrant
    volumes:
      - job-hunter-qdrant:/qdrant/storage
    ports:
      - "6333:6333"

volumes:
  job-hunter-data:
  job-hunter-qdrant:
